title: Gym Buddies documentation
description: Source of truth for the Gym Buddies application
remote_theme: pages-themes/cayman@v0.2.0
baseurl: /gym-buddy-documentation

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-seo-tag

optional_front_matter:
  remove_originals: false

relative_links:
  enabled: true
  collections: true

readme_index:
  enabled: true
  remove_originals: false

titles_from_headings:
  enabled: true
  strip_title: false
  collections: true

exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - .github
