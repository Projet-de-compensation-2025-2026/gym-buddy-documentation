name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Format (apply)
        run: bash .github/scripts/ci/format.sh --write

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github _config.yml _includes .prettierrc.json
          if git diff --cached --quiet; then
            echo "No formatter changes"
          else
            git commit -m "style: apply formatter"
            git push
          fi

      - name: Test
        run: bash .github/scripts/ci/test.sh

      - name: Build site
        run: |
          bundle install
          bundle exec jekyll build --baseurl /gym-buddy-documentation

      - name: Smoke (site must respond)
        run: bash .github/scripts/ci/smoke.sh
